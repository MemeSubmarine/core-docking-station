<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>命令提示符歌词工具</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f0f0;color:#151515;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1200px;margin:0 auto;padding:24px}button,select,input,textarea{font:inherit}button,select{background:#e8e8e8;border:1px solid #888;border-radius:0;color:#111;padding:4px 12px}button{cursor:pointer}button:hover{background:#e3eff9;border-color:#0078d7}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #0067b8;outline-offset:1px}
.deck{border:1px solid #777;background:#0c0c0c}.bar,.transport,.actions,.setting{display:flex;align-items:center;gap:8px}.bar{background:white;height:33px;padding-left:9px}.icon{font:bold 10px Consolas,monospace;color:white;background:#111;border:1px solid #888;padding:0 2px}.bar #filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar button{height:100%;margin-left:auto;background:white;border:0;padding:0 16px;font-size:18px}.bar button:hover{background:#ddd}.screenbody{height:clamp(275px,49vh,580px);overflow:auto;padding:4px 8px;color:var(--text,#ccc);font:var(--size,20px)/1.28 Consolas,"Lucida Console","Microsoft YaHei Mono",monospace;overflow-wrap:anywhere}.cmd{margin:1.28em 0 0}.rows>div{white-space:pre-wrap}.rows>div:last-child:after{content:"";display:inline-block;width:.6em;border-bottom:.13em solid currentColor;margin-left:1px}.transport{padding:8px;background:#f0f0f0;border-top:1px solid #888}.transport input{flex:1;width:0;min-width:40px}time{font:13px Consolas,monospace}input{accent-color:#0078d7}.panels{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin:16px 0}fieldset{min-width:0;border:1px solid #aaa;padding:12px}legend{padding:0 6px}textarea{width:100%;height:108px;resize:vertical;padding:6px;background:white;color:#111;border:1px solid #888}.actions{flex-wrap:wrap;margin-top:8px}.setting{justify-content:space-between;min-height:34px}.setting input[type=range]{width:clamp(60px,14vw,180px)}.setting span{display:flex;align-items:center;gap:8px}.setting output{min-width:40px}#notice{display:block;padding-top:7px;color:#444}.deck:fullscreen,.deck.focus,body[data-player=true] .deck{height:100dvh;display:flex;flex-direction:column}.deck.focus{position:fixed;inset:0;z-index:10}.deck:fullscreen .screenbody,.deck.focus .screenbody,body[data-player=true] .screenbody{flex:1;min-height:0}.deck:fullscreen .bar,.deck.focus .bar{flex-shrink:0}body[data-player=true] main{max-width:none;padding:0}body[data-player=true] .panels{display:none}@media(max-width:680px){main{padding:6px}.panels{grid-template-columns:1fr;gap:8px;margin:8px 0}.transport{gap:4px;flex-wrap:wrap}.transport button{padding:5px 8px}.setting input[type=range]{width:110px}}
</style></head><body><main>
<section id="deck" class="deck" aria-label="命令提示符"><div class="bar"><span aria-hidden="true" class="icon">C:&#92;_</span><span id="filename">命令提示符</span><button id="full" title="切换全屏" aria-label="切换全屏">□</button></div>
<div class="screenbody" id="screen"><div>Microsoft Windows [版本 10.0.19045]</div><div>(c) Microsoft Corporation。保留所有权利。</div><div class="cmd" id="command"></div><div class="rows" id="rows"></div></div>
<div class="transport"><button id="play">▶ 播放</button><button id="reset">从头播放</button><input id="seek" type="range" aria-label="播放进度" min="0" max="1" step=".01" value="0"><time id="clock"></time></div></section>
<div class="panels"><fieldset><legend>歌词文件</legend><input id="file" type="file" accept=".lrc,.txt,text/plain" hidden><textarea id="source" aria-label="歌词文本" placeholder="粘贴歌词，每行一句">凌晨的电台还亮着
风把你的声音送来
穿过城市的信号
在我耳边醒来</textarea><div class="actions"><button id="importer">打开本地文件…</button><button id="apply">载入歌词</button><button id="export">导出离线 HTML…</button></div><small id="notice" role="status">TXT / LRC 文件仅在本机读取。</small></fieldset>
<fieldset><legend>显示与播放</legend><label class="setting">字号<span><input type="range" id="size" min="12" max="72" value="20"><output id="sizeValue" for="size">20 px</output></span></label><label class="setting">文字颜色<input type="color" id="color" value="#cccccc"></label><label class="setting">打字速度<select id="speed"><option value="6">6 字/秒</option><option value="12" selected>12 字/秒</option><option value="24">24 字/秒</option></select></label><label class="setting">每行间隔<select id="gap"><option value="2">2 秒</option><option value="3" selected>3 秒</option><option value="5">5 秒</option></select></label></fieldset></div></main><script>
const el=id=>document.getElementById(id);
const demo=el('source').value;
let applied=demo,name='demo.txt',entries=[],duration=0,pos=0,playing=false,frame=0,start=0,displayKey='',showDemo=true;
function parse(text){
 const timed=[],plain=[];
 const offset=Number(text.match(/\[offset:([+-]?\d+)\]/i)?.[1]||0)/1000;
 for(const raw of text.split(/\r\n?|\n/)){
  const stamps=[...raw.matchAll(/\[(\d+):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
  if(stamps.length){
   const lyric=raw.slice(stamps.at(-1).index+stamps.at(-1)[0].length).trim();
   for(const stamp of stamps) timed.push({at:Math.max(0,60*Number(stamp[1])+Number(stamp[2])+Number('0.'+(stamp[3]||'0'))-offset),text:lyric});
  }else if(raw.trim()&&!/^\s*\[[a-z]+:.*\]\s*$/i.test(raw))plain.push(raw.trim());
 }
 const gap=Number(el('gap').value),speed=Number(el('speed').value);
 let at=0;
 const list=timed.length?timed.sort((a,b)=>a.at-b.at):plain.map(text=>{const item={at,text};at+=Math.max(gap,Array.from(text).length/speed);return item});
 return {list,timed:!!timed.length};
}
const format=n=>Math.floor(n/60).toString().padStart(2,'0')+':'+Math.floor(n%60).toString().padStart(2,'0');
function configure(text,label,preview=false){
 const parsed=parse(text);
 if(!parsed.list.some(e=>e.text)){el('notice').textContent='请先输入至少一句歌词';return false}
 pause();applied=text;name=label;entries=parsed.list;entries.forEach(e=>e.chars=Array.from(e.text));showDemo=preview;
 const last=entries.at(-1);duration=last.at+Math.max(Number(el('gap').value),last.chars.length/Number(el('speed').value)+.5);
 pos=0;el('seek').max=duration;el('gap').disabled=parsed.timed;el('filename').textContent='命令提示符 - '+name;
 el('command').textContent='C:\\Lyrics>type "'+name+'"';displayKey='';render();return true;
}
function render(){
 const t=showDemo?entries[Math.min(2,entries.length-1)].at+.5:pos;
 let low=0,high=entries.length;
 while(low<high){const mid=Math.floor((low+high)/2);if(entries[mid].at<=t)low=mid+1;else high=mid}
 const idx=low-1,e=entries[idx],span=e?(entries[idx+1]?.at??duration)-e.at:0;
 const rate=e?Math.max(Number(el('speed').value),e.chars.length/Math.max(.01,span-.15)):0;
 const chars=e?Math.min(e.chars.length,Math.floor((t-e.at)*rate)+1):0;
 const key=idx+'/'+chars;
 if(displayKey!==key){displayKey=key;const nodes=entries.slice(Math.max(0,idx-24),idx+1).map((line,i,arr)=>{const node=document.createElement('div');node.textContent=i===arr.length-1?line.chars.slice(0,chars).join(''):line.text;return node});el('rows').replaceChildren(...nodes);el('screen').scrollTop=el('screen').scrollHeight}
 el('seek').value=pos;el('clock').textContent=format(pos)+' / '+format(duration);
}
function pause(){if(playing)pos=Math.min(duration,(performance.now()-start)/1000);playing=false;cancelAnimationFrame(frame);el('play').textContent='▶ 播放'}
function tick(now){pos=Math.min(duration,(now-start)/1000);render();if(pos>=duration)pause();else frame=requestAnimationFrame(tick)}
function play(){showDemo=false;if(pos>=duration)pos=0;playing=true;start=performance.now()-pos*1000;el('play').textContent='Ⅱ 暂停';frame=requestAnimationFrame(tick)}
el('play').onclick=()=>playing?pause():play();
el('reset').onclick=()=>{pause();pos=0;play()};
el('seek').oninput=()=>{showDemo=false;pos=Number(el('seek').value);start=performance.now()-pos*1000;render()};
el('apply').onclick=()=>{if(configure(el('source').value,'lyrics.txt')){el('notice').textContent='已载入 · '+entries.length+' 行';play()}};
el('importer').onclick=()=>el('file').click();
el('file').onchange=async event=>{const f=event.target.files[0];if(!f)return;try{const text=await f.text();if(configure(text,f.name)){el('source').value=text;el('notice').textContent='已导入 · '+entries.length+' 行';play()}}catch{el('notice').textContent='文件读取失败，请重试'}event.target.value=''};
for(const id of ['gap','speed'])el(id).onchange=()=>{const active=playing,old=pos;configure(applied,name,showDemo);pos=Math.min(old,duration);render();if(active)play()};
el('full').onclick=async()=>{const deck=el('deck');if(document.fullscreenElement)await document.exitFullscreen();else if(deck.classList.contains('focus'))deck.classList.remove('focus');else try{await deck.requestFullscreen()}catch{deck.classList.add('focus')}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')el('deck').classList.remove('focus')});

const exported=document.body.dataset.player==='true';
function updateAppearance(){
 document.documentElement.style.setProperty('--size',el('size').value+'px');
 document.documentElement.style.setProperty('--text',el('color').value);
 el('sizeValue').textContent=el('size').value+' px';
}
el('size').oninput=el('color').oninput=updateAppearance;
function exportPlayer(){
 const text=el('source').value;
 if(!parse(text).list.some(line=>line.text)){el('notice').textContent='请先输入歌词';return}
 const label=text===applied?name:'lyrics.txt';
 const root=document.documentElement.cloneNode(true);
 const get=id=>root.querySelector('#'+id);
 root.querySelector('body').dataset.player='true';
 root.querySelector('body').dataset.track=label;
 root.querySelector('title').textContent='命令提示符 - '+label;
 get('source').textContent=text;
 get('rows').replaceChildren();
 get('command').textContent='';
 get('deck').classList.remove('focus');
 for(const id of ['size','color'])get(id).setAttribute('value',el(id).value);
 for(const id of ['speed','gap']){
  for(const option of get(id).options)option.toggleAttribute('selected',option.value===el(id).value);
 }
 const url=URL.createObjectURL(new Blob(['<!doctype html>\n',root.outerHTML],{type:'text/html;charset=utf-8'}));
 const link=document.createElement('a');
 link.href=url;
 link.download=label.replace(/\.[^.]+$/,'')+'-命令提示符.html';
 document.body.append(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 el('notice').textContent='已生成离线播放页';
}
el('export').onclick=exportPlayer;
updateAppearance();
configure(demo,exported?document.body.dataset.track:name,!exported);
if(exported)play();
</script></body></html>
