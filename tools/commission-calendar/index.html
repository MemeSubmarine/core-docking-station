function form(type,i={}){const order=type==='order';show(i.id?'编辑'+(order?'订单':'便签'):'新建'+(order?'订单':'便签'),'<form><label>'+(order?'订单名称':'便签内容')+'<input name="title" required maxlength="160" value="'+esc(i.title)+'" autofocus></label>'+(order?'<label>截稿时间<input required type="datetime-local" name="due" value="'+esc(i.due||((view==='day'?day:month===now().slice(0,7)?now():month+'-01')+'T18:00'))+'"></label>':'')+'<label>补充说明<textarea name="body">'+esc(i.body)+'</textarea></label>'+(order?'<label>图钉图案<select name="pin">'+[['Pin','图钉'],['Star','星星'],['Flower2','花朵'],['Leaf','叶子']].map(([n,t])=>'<option value="'+n+'" '+(i.pin===n?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label>自定义图钉图片<input type="file" name="custom" accept="image/*"></label>'+(i.pic?'<label><span><input type="checkbox" style="width:auto" name="reset"> 移除已有自定义图钉</span></label>':'')+'<label><span><input type="checkbox" name="done" style="width:auto" '+(i.done?'checked':'')+'> 已完成</span></label>':'')+'<div class="row">'+(i.id?'<button type="button" class="danger" data-remove="'+i.id+'">删除</button>':'')+'<button class="primary">保存</button></div></form>');
modal.querySelector('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const f=new FormData(e.target),title=f.get('title').trim();if(!title){say('请填写内容');return}let item={...i,id:i.id||uid(),type,title,body:f.get('body').trim()};if(order){const file=f.get('custom');Object.assign(item,{due:f.get('due'),pin:f.get('pin'),done:f.has('done'),pic:file.size?await resize(file,64):f.has('reset')?'':i.pic||''})}else item.day=i.day||day;await change(item);modal.close()}catch(err){say('保存失败：'+err.message)}finally{busy=false}}}
async function resize(file,limit){if(file.size>25*1024*1024)throw Error('单张图片请小于 25 MB');const bitmap=await createImageBitmap(file);try{const scale=Math.min(1,limit/Math.max(bitmap.width,bitmap.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bitmap.width*scale));c.height=Math.max(1,Math.round(bitmap.height*scale));c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);return c.toDataURL('image/webp',.86)}finally{bitmap.close()}}
async function ingest(files,mode){let done=0;const target=month;for(const f of files){try{const sticker=mode==='sticker',pic=await resize(f,sticker?192:1600);await change({id:uid(),type:sticker?'sticker':'ref',title:f.name,pic,time:Date.now(),month:target,x:50,y:50});done++}catch(e){say('导入中止，已保存 '+done+' 张。'+e.message);return}}say('已导入 '+done+' 张')}
let uploadMode='ref';function upload(mode){uploadMode=mode;$('#files').multiple=mode==='ref';$('#files').click()}$('#files').onchange=e=>{const files=[...e.target.files];e.target.value='';ingest(files,uploadMode)};$('#import').onclick=()=>upload('ref');$('#wall').ondragover=e=>e.preventDefault();$('#wall').ondrop=e=>{e.preventDefault();ingest(e.dataTransfer.files,'ref')};
$('#orient').onclick=()=>change({id:'layout',value:vert()?'h':'v'});window.onresize=drawLayout;
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(b.dataset.day){day=b.dataset.day;month=day.slice(0,7);view='day'}else if(b.dataset.remove){const i=items.find(x=>x.id===b.dataset.remove);if(i&&confirm('移除这条记录？')){await change(i,true);modal.close()}return}else if(b.dataset.item){const i=items.find(x=>x.id===b.dataset.item);if(!i)return;if(i.type==='ref')show(i.title,'<img class="preview" alt="参考图" src="'+i.pic+'"><button class="danger" data-remove="'+i.id+'">移除图片</button>');else form(i.type,i);return}else if(['calendar','orders','refs'].includes(a))view=a;else if(a==='prev'||a==='next'){let d=local(month+'-01');d.setMonth(d.getMonth()+(a==='prev'?-1:1));month=date(d).slice(0,7)}else if(a==='today')month=now().slice(0,7);else if(a==='order'||a==='note'){form(a);return}else if(a==='decor')decor=!decor;else if(a==='addSticker'||a==='upload'){upload(a==='addSticker'?'sticker':'ref');return}else if(a==='close'){modal.close();return}else return;render()});
document.onpointerdown=e=>{if(!decor||!e.target.matches('.sticker'))return;const el=e.target;el.setPointerCapture(e.pointerId);drag={el,item:items.find(x=>x.id===el.dataset.st),startX:e.clientX,startY:e.clientY,moved:false}};
document.onpointermove=e=>{if(!drag)return;const {el}=drag,r=el.parentElement.getBoundingClientRect();if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)drag.moved=true;if(!drag.moved)return;drag.x=Math.max(5,Math.min(95,(e.clientX-r.left)*100/r.width));drag.y=Math.max(5,Math.min(95,(e.clientY-r.top)*100/r.height));el.style.left=drag.x+'%';el.style.top=drag.y+'%'};
document.onpointerup=async()=>{if(!drag)return;const d=drag;drag=null;if(d.moved)await change({...d.item,x:d.x,y:d.y});else if(confirm('移除这张贴纸？'))await change(d.item,true)};document.onpointercancel=()=>{drag=null;drawLeft()};
window.addEventListener('unhandledrejection',()=>say('无法保存更改，请检查浏览器存储空间'));const req=indexedDB.open('illustrator-desk-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('items',{keyPath:'id'});req.onsuccess=()=>{db=req.result;reload();if(channel)channel.onmessage=reload;setInterval(countdown,30000)};req.onerror=()=>say('本地数据库无法打开，请使用支持本地存储的浏览器');
