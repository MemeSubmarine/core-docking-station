<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>时序手记 · 本地时间轴记事本</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#253e39;background:#f4f6f3;font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid #cdd6cf;border-radius:8px;padding:8px 14px}button:hover{filter:brightness(.96)}:focus-visible{outline:3px solid #ce814e;outline-offset:2px}header{background:#123e37;color:white}header>div,main{width:min(1240px,94%);margin:auto}header>div,.row,.actions{display:flex;align-items:center;gap:12px}header>div{height:64px;justify-content:space-between}.brand{font-weight:750;font-size:20px;letter-spacing:.06em}.mark{display:inline-block;width:26px;height:30px;background:repeating-linear-gradient(0deg,#d7ebe0 0 3px,transparent 3px 8px);border-left:5px solid #f1a67b;vertical-align:middle;margin-right:9px;transform:skewY(-8deg)}.privacy{color:#c5dbd0;font-size:14px}main{padding:32px 0 48px}.intro{justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}h1,h2,p{margin:0}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.045em}h2{font-size:18px}.sub,small,summary{color:#586b63}.primary{background:#185548;color:white;border-color:#185548;font-weight:650}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.card{background:#fff;border:1px solid #d1d9d1;border-radius:14px;overflow:hidden}.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #dce2db}.edit{padding:20px}.title{width:100%;border:none;border-bottom:1px solid #dae1db;font-size:23px;font-weight:700;padding:0 0 12px;background:transparent}textarea{display:block;width:100%;resize:vertical;min-height:360px;border:none;line-height:1.9;padding:16px 0;background:transparent}.foot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #e1e7e1;padding-top:12px;font-size:14px;color:#596b62}details{padding:13px 20px;border-top:1px solid #dce2db;font-size:14px}summary{cursor:pointer}.stage{background-color:#e9eee8;background-image:radial-gradient(#bdcabf 1px,transparent 1px);background-size:12px 12px;padding:24px;max-height:660px;overflow:auto}.paper{background:#fffdf5;border-top:6px solid #e89866;padding:30px 28px;box-shadow:0 3px 10px #24443814;overflow-wrap:anywhere}.paper h3{font:bold 30px/1.4 Georgia,"Songti SC",serif;margin:0 0 22px;padding-bottom:18px;border-bottom:1px solid #cad1c3}.event{margin-left:4px;padding:0 0 22px 22px;border-left:2px solid #c8d4c5;position:relative}.event:last-child{border-left-color:transparent;padding-bottom:0}.event:before{content:"";position:absolute;background:#cf7548;border:3px solid #fffdf5;border-radius:50%;width:9px;height:9px;left:-8px;top:5px}.stamp{color:#795139;font:600 14px/1.6 ui-monospace,monospace}.entry{white-space:pre-wrap;line-height:1.55;margin-top:4px}.count{border-radius:20px;background:#eaf2ec;padding:2px 10px;color:#355d4c;font-size:14px}button:disabled{opacity:.55;cursor:default}#msg{margin-top:8px;color:#86451e}dialog{width:min(520px,94%);max-height:85vh;border:1px solid #b5c6bb;border-radius:12px}dialog::backdrop{background:#112f2b88}dialog img{width:100%;display:block;margin-top:12px}.actions{flex-wrap:wrap}@media(max-width:760px){main{padding-top:18px}.grid{grid-template-columns:minmax(0,1fr)}.stage{padding:16px}.intro{gap:14px}.edit{padding:16px}textarea{min-height:240px}.paper{padding:22px}.privacy{font-size:13px}}
</style></head><body>
<header><div><span class="brand"><span class="mark" aria-hidden="true"></span>时序手记</span><span class="privacy">本地工作区</span></div></header>
<main><div class="row intro"><div><h1>时间轴记事本</h1><p class="sub">写下时间与事件，实时生成时间轴长图。</p></div><div class="actions"><button id="backup">保存文本</button><button id="exportBtn" class="primary">导出 PNG 长图</button></div></div>
<div class="grid"><section class="card"><div class="bar"><h2>笔记编辑</h2><small id="saved"></small></div><div class="edit"><input class="title" id="title" aria-label="笔记标题" placeholder="笔记标题"><textarea id="note" aria-label="笔记正文" placeholder="00:00 开场&#10;在这里写下分镜描述……"></textarea><div class="foot"><span id="chars"></span><span>按原文顺序排列</span></div></div><details><summary>时间格式与识别规则</summary><p>在行首写时间，例如 00:12、01:03.500、1:02:03、2026-11-20、11月20日、AD1356 或 DAY 2，后面接事件。也支持 [00:12] 和列表符号。后续普通行归入上一节点，首个时间前的文字仅保留在笔记中。</p></details></section>
<section class="card"><div class="bar"><h2>长图预览</h2><span class="count" id="count"></span></div><div class="stage"><article class="paper"><h3 id="heading"></h3><div id="events"></div></article></div></section></div><p id="msg" role="status"></p></main>
<dialog id="result"><div class="bar"><h2>时间轴长图</h2><button id="closeBtn">关闭</button></div><p>可长按图片保存，或使用 <a id="download">下载 PNG</a>。</p><img id="output" alt="导出的时间轴长图"></dialog>
<script>
'use strict';
const el=id=>document.getElementById(id);
const key='shoushu.timeline-notebook.v1';
const demo={title:'海边的一天 · 分镜手记',note:'00:00  海岸，清晨\n镜头从潮湿的沙面缓缓抬起。\n\n00:08  第一班渡轮\n汽笛响起，白色船身驶入画面。\n\n00:24  逆光的人影\n风吹起衣角，切到手部特写。\n\n00:42  潮声渐远\n海鸟掠过水面，画面淡出。'};
const note=el('note'), title=el('title');
const clock=String.raw`\d{1,3}[:：][0-5]\d(?:[:：][0-5]\d)?(?:[.,]\d{1,3})?`;
const day=String.raw`(?:\d{4}[-/.]\d{1,2}[-/.]\d{1,2}|(?:\d{4}年)?\d{1,2}月\d{1,2}[日号]?)`;
const marker=new RegExp(String.raw`^\s*(?:[-*•]\s+)?[【\[]?((?:${day})(?:[ T]+${clock})?|${clock}|AD\s*\d{1,6}(?:\s*[-–—]\s*\d{1,6})?|\d{1,4}年|DAY\s*\d+|第\s*[零一二三四五六七八九十百\d]+\s*天)(?![\d:：]\d)[】\]]?\s*(?:[|｜：:、，,]|[-—–](?=\s))?\s*(.*)$`,'i');
function parse(value){const rows=[];for(const line of value.split(/\r?\n/)){const match=line.match(marker);if(match)rows.push({time:match[1],body:match[2]});else if(rows.length)rows.at(-1).body+='\n'+line}return rows.map(r=>({...r,body:r.body.trim()}))}
let rows=[],imageURL='';
function render(){rows=parse(note.value);el('heading').textContent=title.value.trim()||'未命名笔记';el('count').textContent=rows.length+' 个节点';el('chars').textContent=Array.from(note.value).length+' 字符';el('exportBtn').disabled=!rows.length;const fragment=document.createDocumentFragment();for(const r of rows){const node=document.createElement('div'),time=document.createElement('div'),body=document.createElement('div');node.className='event';time.className='stamp';body.className='entry';time.textContent=r.time;body.textContent=r.body;node.append(time,body);fragment.append(node)}el('events').replaceChildren(fragment);if(!rows.length)el('events').textContent='在正文行首输入时间，即可在这里预览。'}
let sample=true;
try{const data=JSON.parse(localStorage.getItem(key));if(data&&typeof data.note==='string'&&typeof data.title==='string'){note.value=data.note;title.value=data.title;sample=false}}catch{}
if(sample){note.value=demo.note;title.value=demo.title}
el('saved').textContent=sample?'可编辑的示例':'已恢复本地笔记';render();
function edit(){render();try{localStorage.setItem(key,JSON.stringify({title:title.value,note:note.value}));el('saved').textContent='已保存到本机'}catch{el('saved').textContent='本地保存失败，请保存文本'}}
note.oninput=title.oninput=edit;
function filename(){return (el('heading').textContent.replace(/[\\/:*?"<>|]/g,'_').slice(0,80)||'笔记')}
el('backup').onclick=()=>{const url=URL.createObjectURL(new Blob([title.value+'\n\n'+note.value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename()+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};
function wrap(ctx,value,width){const lines=[];for(const para of value.split('\n')){let line='',size=0;for(const ch of para){const w=ctx.measureText(ch).width;if(line&&size+w>width){lines.push(line);line='';size=0}line+=ch;size+=w}lines.push(line)}return lines}
async function exportImage(){const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');const heading=el('heading').textContent;
ctx.font='bold 40px serif';const head=wrap(ctx,heading,682);let y=54+head.length*56+42;
ctx.font='24px sans-serif';const items=rows.map(row=>{const top=y,lines=wrap(ctx,row.body,630);y+=40+lines.length*36+32;return {top,lines,time:row.time}});
const height=y+16,scale=Math.min(1.5,16000/height,Math.sqrt(16000000/(780*height)));if(scale<0.55)throw Error('这篇笔记超出单张长图容量，请分段导出。');
canvas.width=Math.floor(780*scale);canvas.height=Math.ceil(height*scale);ctx.scale(scale,scale);ctx.fillStyle='#fffdf5';ctx.fillRect(0,0,780,height);ctx.fillStyle='#e89866';ctx.fillRect(0,0,780,10);ctx.textBaseline='top';ctx.fillStyle='#253e39';ctx.font='bold 40px serif';head.forEach((s,i)=>ctx.fillText(s,48,48+i*56));ctx.fillStyle='#cad1c3';ctx.fillRect(48,items[0].top-26,682,2);ctx.fillRect(59,items[0].top+10,3,items.at(-1).top-items[0].top);
for(const item of items){ctx.fillStyle='#cf7548';ctx.beginPath();ctx.arc(60,item.top+12,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#795139';ctx.font='bold 21px monospace';ctx.fillText(item.time,92,item.top);ctx.fillStyle='#253e39';ctx.font='24px sans-serif';item.lines.forEach((s,i)=>ctx.fillText(s,92,item.top+38+i*36))}
const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('图片生成失败，请缩短笔记重试。');if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(blob);el('output').src=imageURL;el('download').href=imageURL;el('download').download=filename()+'.png';el('result').showModal()}
el('exportBtn').onclick=async()=>{el('exportBtn').disabled=true;el('msg').textContent='';try{await exportImage()}catch(e){el('msg').textContent=e.message}finally{el('exportBtn').disabled=!rows.length}};el('closeBtn').onclick=()=>el('result').close();
</script></body></html>
